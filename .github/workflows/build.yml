name: Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check cache
        run: |
          echo upstream_heads=`git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: huami1314/theos-action@main

      - name: Setup GNU Make
        run: |
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Build rootful
        run: |
          cd NoUpdateAlert
          make clean
          make package FINALPACKAGE=1
          mkdir -p ../artifacts/rootful
          cp packages/*.deb ../artifacts/rootful/

      - name: Build rootless
        run: |
          cd NoUpdateAlert
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          mkdir -p ../artifacts/rootless
          cp packages/*.deb ../artifacts/rootless/

      - name: Build roothide
        run: |
          cd NoUpdateAlert
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1
          mkdir -p ../artifacts/roothide
          cp packages/*.deb ../artifacts/roothide/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NoUpdateAlert
          path: artifacts/**/*.deb
